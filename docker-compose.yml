version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: guess-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: guess
      POSTGRES_PASSWORD: guess_password
      POSTGRES_DB: guess
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guess -d guess"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
